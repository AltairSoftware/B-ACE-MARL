# B-ACE MAPPO configuration
# Edit this file to change scenario, rewards, and hyperparameters.

env:
  env_path: "../../bin/B_ACE_v0.1_custom.exe"
  renderize: 0          # 0: headless (training), 1: display (debug)
  speed_up: 100000
  max_cycles: 1200
  seed: 1
  action_type: "Low_Level_Continuous"

rewards:
  mission_factor:              0.0001
  missile_fire_factor:        -0.1
  missile_no_fire_factor:     -0.0
  missile_miss_factor:        -0.5
  detect_loss_factor:         -0.1
  keep_track_factor:           0.0001
  hit_enemy_factor:            3.0
  hit_own_factor:             -5.0
  mission_accomplished_factor: 10.0

agents:
  blue:
    num_agents: 2
    base_behavior: "external"
    mission: "DCA"
    init_position: {x: 0.0, y: 25000.0, z: 0.8}      # x,z:NM, y:ft
    init_hdg: 0.0
    target_position: {x: 0.0, y: 25000.0, z: 0.8}
    rnd_offset_range: {x: 10.0, y: 10000.0, z: 5.0}
    fighter_spec: "fighter_spec.json"
    missile_spec:  "missile_spec.json"
  red:
    num_agents: 2
    base_behavior: "external"     # controlled by RedTeamPolicy (Python-side)
    mission: "striker"
    init_position: {x: 0.0, y: 25000.0, z: -0.8}
    init_hdg: 180.0
    share_states: 1
    share_tracks: 1
    shot_threshold: 0.85          # fire when offensive_factor exceeds this
    shot_variation: 0.10          # ±uniform noise on shot_threshold
    beh_config:                   # kept for Godot config compatibility
      dShot:  [0.85]
      lCrank: [0.60]
      lBreak: [0.95]
    fighter_spec: "fighter_spec.json"
    missile_spec:  "res://assets/specs/default_missile_spec.json"

algo:
  num_envs:        30
  num_steps:       1024        # number of steps until updating policy
  total_timesteps: 100000000
  update_epochs:   4
  num_minibatches: 4
  gamma:           0.99
  gae_lambda:      0.95
  clip_coef:       0.2
  clip_vloss:      true
  ent_coef:        0.01
  vf_coef:         0.5
  max_grad_norm:   0.5
  learning_rate:   3.0e-4
  hidden_sizes:    [256, 256]

# Combat area boundaries in NM (nautical miles) -- same scale as init_position x/z.
# Conversion to normalized obs coords: NM * 18.52 / 3000  (applied in vec_env.py)
#
# Set to null to disable combat area (no boundary obs, no penalty).
combat_area:
  x_min: -1   # lateral left boundary  (NM)
  x_max:  1   # lateral right boundary (NM)
  z_min: -1   # longitudinal near boundary (NM)
  z_max:  1   # longitudinal far boundary (NM)
  out_penalty: -1.0   # reward penalty per step when any blue agent is outside

logging:
  exp_name:            "mappo_b_ace"
  save_dir:            "Results"
  checkpoint_interval: 10   # iterations between checkpoints
  restore: null              # set to a checkpoint path to resume, e.g. "Results/mappo_b_ace_xxx/checkpoint_100.pt"
